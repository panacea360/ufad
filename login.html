    <style>
        /* --- DYNAMIC THEME VARIABLES --- */
        :root {
            --bg-color: #FAF7F2;
            --text-dark: #0B1D33;
            --text-muted: #6B6B6B;
            --white: #FFFFFF;
            --border: #E5DFD6;
            --accent: #E8642C;
            --accent-light: #FDF0EA;
            --accent-glow: rgba(232, 100, 44, 0.4);
            --gradient-1: #E8642C;
            --gradient-2: #F59E0B;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.theme-beneficiary {
            --accent: #0284C7;
            --accent-light: #E0F2FE;
            --accent-glow: rgba(2, 132, 199, 0.4);
            --gradient-1: #0284C7;
            --gradient-2: #38BDF8;
        }

        body.theme-admin {
            --accent: #D97706;
            --accent-light: #FEF3C7;
            --accent-glow: rgba(217, 119, 6, 0.4);
            --gradient-1: #D97706;
            --gradient-2: #FBBF24;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'DM Sans', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-dark); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: var(--transition);
        }

        body.lang-fr .lang-en { display: none !important; }
        body.lang-en .lang-fr { display: none !important; }

        /* --- ANIMATED BACKGROUND ORBS --- */
        .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; opacity: 0.6; transition: var(--transition); }
        .orb { position: absolute; border-radius: 50%; filter: blur(60px); animation: float 10s infinite alternate ease-in-out; transition: var(--transition); }
        .orb-1 { width: 300px; height: 300px; background: var(--gradient-1); top: -100px; left: -100px; opacity: 0.2; }
        .orb-2 { width: 250px; height: 250px; background: var(--gradient-2); bottom: -50px; right: -50px; opacity: 0.15; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }

        /* --- HEADER --- */
        header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: var(--text-dark); }
        .logo img { height: 36px; transition: var(--transition); }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; line-height: 1.1; }
        .logo-text span { display: block; font-family: 'DM Sans', sans-serif; font-size: 0.55rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin-top: 2px; }
        
        .lang-btn { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border: 1px solid var(--border); color: var(--text-dark); padding: 0.4rem 1rem; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 0.75rem; transition: var(--transition); }
        .lang-btn:hover { background: var(--white); }

        /* --- MAIN AUTH CONTAINER --- */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 1rem 1.5rem 2rem; z-index: 1; }

        .auth-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(255,255,255,0.5) inset;
            padding: 2rem 1.5rem;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardEntrance { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }

        /* --- ROLE TOGGLE --- */
        .role-toggle-container { display: flex; background: var(--accent-light); border-radius: 50px; padding: 4px; position: relative; margin-bottom: 1.5rem; transition: var(--transition); }
        .role-toggle-slider { position: absolute; top: 4px; left: 4px; width: calc(50% - 4px); height: calc(100% - 8px); background: var(--white); border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.4s ease; z-index: 1; }
        body.theme-beneficiary .role-toggle-slider { transform: translateX(100%); }
        
        .role-btn { flex: 1; padding: 0.8rem 0; border: none; background: none; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; position: relative; z-index: 2; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .role-btn.active { color: var(--accent); }

        /* --- AUTH MODE SWITCH --- */
        .auth-mode-switch { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 0.8rem; }
        .mode-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; transition: var(--transition); position: relative; font-family: 'DM Sans', sans-serif; }
        .mode-btn.active { color: var(--text-dark); }
        .mode-btn.active::after { content: ''; position: absolute; bottom: -0.9rem; left: 0; right: 0; height: 3px; background: var(--accent); border-radius: 3px 3px 0 0; animation: widthGrow 0.3s ease; }
        @keyframes widthGrow { from { width: 0; left: 50%; } to { width: 100%; left: 0; } }

        /* --- FORMS --- */
        .forms-wrapper { position: relative; }
        .form-panel { display: none; animation: formSlide 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .form-panel.active { display: block; }
        @keyframes formSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .label-hint { font-size: 0.65rem; color: var(--text-muted); text-transform: none; font-weight: 500; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 1rem; color: var(--text-muted); font-size: 0.9rem; transition: var(--transition); }
        .input-wrapper input { width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; background: var(--white); color: var(--text-dark); transition: var(--transition); }
        .input-wrapper input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
        .input-wrapper input:focus + i { color: var(--accent); }

        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 1rem; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; box-shadow: 0 8px 20px var(--accent-glow); }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        /* --- ALERTS --- */
        .alert { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem; display: none; text-align: center; }
        .alert.success { background: #DCFCE7; color: #166534; display: block; border: 1px solid #BBF7D0; }
        .alert.error { background: #FEE2E2; color: #991B1B; display: block; border: 1px solid #FECACA; }

        /* --- ADMIN PORTAL --- */
        .admin-portal-container { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); }
        .admin-link { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; transition: var(--transition); text-decoration: underline; }
        .admin-link:hover { color: var(--accent); }

        /* --- ADMIN MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(11, 29, 51, 0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 1.5rem; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--white); border-radius: 20px; padding: 2rem 1.5rem; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); position: relative; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-close { position: absolute; top: 1rem; right: 1rem; background: var(--bg-color); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
    </style>
</head>

    <script>
        // --- 1. SUPABASE CONFIG ---
        const SUPABASE_URL = 'https://jmkvstlfskolktnrpdqd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta3ZzdGxmc2tvbGt0bnJwZHFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyOTMzNjEsImV4cCI6MjEwNjg2OTM2MX0.cP1In9_cgG4E2VqxtOe3iZlP7Pr1E8vZkYEFHCas8YE';

        const PIN_SUFFIX = '_UFAD_SECURE';

        // --- 2. STATE & UTILS ---
        let currentRole = 'donor';
        let currentMode = 'login';

        function toggleLanguage() {
            const body = document.body;
            if (body.classList.contains('lang-fr')) body.classList.replace('lang-fr', 'lang-en');
            else body.classList.replace('lang-en', 'lang-fr');
        }

        function switchRole(role) {
            currentRole = role;
            const body = document.body;
            const donorBtn = document.querySelectorAll('.role-btn')[0];
            const benBtn = document.querySelectorAll('.role-btn')[1];

            donorBtn.classList.remove('active');
            benBtn.classList.remove('active');

            if (role === 'donor') {
                body.classList.remove('theme-beneficiary', 'theme-admin');
                body.classList.add('theme-donor');
                donorBtn.classList.add('active');
            } else {
                body.classList.remove('theme-donor', 'theme-admin');
                body.classList.add('theme-beneficiary');
                benBtn.classList.add('active');
            }
            updateFormView();
        }

        function switchAuthMode(mode) {
            currentMode = mode;
            document.getElementById('btn-mode-login').classList.toggle('active', mode === 'login');
            document.getElementById('btn-mode-signup').classList.toggle('active', mode === 'signup');
            updateFormView();
        }

        function updateFormView() {
            document.querySelectorAll('.form-panel').forEach(f => f.classList.remove('active'));
            document.getElementById('alert-box').className = 'alert';
            const targetForm = document.getElementById(`${currentRole}-${currentMode}`);
            if (targetForm) targetForm.classList.add('active');
        }

        function showAlert(type, messageFr, messageEn) {
            const box = document.getElementById('alert-box');
            box.className = `alert ${type}`;
            box.innerHTML = `<span class="lang-fr">${messageFr}</span><span class="lang-en">${messageEn}</span>`;
        }

        function formatPhone(phone) {
            return phone.replace(/[\s\-\(\)]/g, '');
        }

        // --- 3. AUTH LOGIC ---
        async function handleAuth(e, role, mode) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalBtnHTML = btn.innerHTML;
            
            document.getElementById('alert-box').className = 'alert';
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                if (mode === 'signup') {
                    await handleSignup(role, btn, originalBtnHTML);
                } else {
                    await handleLogin(role, btn, originalBtnHTML);
                }
            } catch (error) {
                console.error(error);
                showAlert('error', "Une erreur inattendue est survenue.", "An unexpected error occurred.");
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
            }
        }

        async function handleSignup(role, btn, originalBtnHTML) {
            const prefix = role === 'donor' ? 'signup' : 'ben-signup';
            const name = document.getElementById(`${prefix}-name`).value.trim();
            const phone = document.getElementById(`${prefix}-phone`).value.trim();
            const email = document.getElementById(`${prefix}-email`).value.trim();
            const pin = document.getElementById(`${prefix}-pin`).value;

            const cleanPhone = formatPhone(phone);
            // We still use a synthetic email for Supabase Auth to avoid needing real emails
            const syntheticEmail = `${cleanPhone.replace('+', '')}@ufad.local`;
            const securePassword = pin + PIN_SUFFIX;

            const { data: authData, error: authError } = await sb.auth.signUp({
                email: syntheticEmail,
                password: securePassword,
                options: {
                    data: {
                        full_name: name,
                        phone: cleanPhone,
                        record_email: email || 'N/A',
                        role: role
                    }
                }
            });

            if (authError) {
                if (authError.message.includes('already registered') || authError.status === 422) {
                    showAlert('error', "Ce numéro est déjà enregistré. Veuillez vous connecter.", "This phone number is already registered. Please sign in.");
                } else if (authError.message.includes('rate limit')) {
                    showAlert('error', "Limite de création atteinte. Veuillez désactiver la confirmation par email dans Supabase.", "Rate limit reached. Please disable email confirmation in Supabase.");
                } else {
                    showAlert('error', `Erreur: ${authError.message}`, `Error: ${authError.message}`);
                }
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
                return;
            }

            showAlert('success', "Compte créé avec succès! Redirection...", "Account created successfully! Redirecting...");
            // Since we disabled email confirmation, we can log them in immediately
            setTimeout(() => redirectUser(authData.user.id), 1000);
        }

        async function handleLogin(role, btn, originalBtnHTML) {
            const prefix = role === 'donor' ? 'login' : 'ben-login';
            const phone = document.getElementById(`${prefix}-phone`).value.trim();
            const pin = document.getElementById(`${prefix}-pin`).value;

            const cleanPhone = formatPhone(phone);
            const syntheticEmail = `${cleanPhone.replace('+', '')}@ufad.local`;
            const securePassword = pin + PIN_SUFFIX;

            const { data, error } = await sb.auth.signInWithPassword({
                email: syntheticEmail,
                password: securePassword
            });

            if (error) {
                showAlert('error', "Numéro de téléphone ou PIN incorrect.", "Incorrect phone number or PIN.");
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
                return;
            }

            // Verify Role matches using ufad_profiles
            const { data: profile, error: profileError } = await sb
                .from('ufad_profiles')
                .select('role')
                .eq('id', data.user.id)
                .single();

            if (profileError || !profile) {
                showAlert('error', "Erreur de profil. Contactez le support.", "Profile error. Contact support.");
                await sb.auth.signOut();
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
                return;
            }

            if (profile.role !== role) {
                showAlert('error', "Ce compte n'est pas un compte " + role + ".", "This is not a " + role + " account.");
                await sb.auth.signOut();
                btn.disabled = false;
                btn.innerHTML = originalBtnHTML;
                return;
            }

            showAlert('success', "Connexion réussie! Redirection...", "Login successful! Redirecting...");
            setTimeout(() => redirectUser(data.user.id), 1000);
        }

        // --- 4. REDIRECTION LOGIC ---
        async function redirectUser(userId) {
            const { data: profile } = await sb.from('ufad_profiles').select('role').eq('id', userId).single();
            
            if (profile.role === 'donor') {
                window.location.href = 'donor-dashboard.html';
            } else if (profile.role === 'beneficiary') {
                window.location.href = 'member-dashboard.html';
            } else if (profile.role === 'admin') {
                window.location.href = 'admin-dashboard.html';
            }
        }

        // --- 5. ADMIN MODAL ---
        function openAdminModal() {
            document.getElementById('admin-modal').classList.add('active');
            document.body.classList.add('theme-admin');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.remove('active');
            document.body.classList.remove('theme-admin');
            document.body.classList.add(currentRole === 'donor' ? 'theme-donor' : 'theme-beneficiary');
        }

        document.getElementById('admin-modal').addEventListener('click', function(e) {
            if (e.target === this) closeAdminModal();
        });

        // --- 6. PWA SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered', reg))
                    .catch(err => console.log('Service Worker Error', err));
            });
        }

    </script>
</body>
</html>
